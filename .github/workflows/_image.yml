name: image

# 可复用工作流：构建并推送两个镜像，输出 manifest digest。
on:
  workflow_call:
    inputs:
      tag:
        description: 镜像 tag
        required: true
        type: string
      version:
        description: 写入二进制的版本号
        required: true
        type: string
    outputs:
      agent-digest:
        description: agent 镜像的 manifest digest
        value: ${{ jobs.image.outputs.agent-digest }}
      bridge-digest:
        description: containerd-bridge 镜像的 manifest digest
        value: ${{ jobs.image.outputs.bridge-digest }}

permissions:
  contents: read
  packages: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      agent-digest: ${{ steps.agent.outputs.digest }}
      bridge-digest: ${{ steps.bridge.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # builder 镜像可能未设为 public，先登录 GHCR 再解析 digest
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          # 仓库变量与密钥的命名兼容两种写法
          username: ${{ vars.DOCKERHUB_USERNAME || vars.username || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.token }}

      # 按 digest 固定构建环境：latest 变动不会改变本次构建使用的工具链。
      - name: 解析 builder digest
        id: builder
        run: |
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' \
            ghcr.io/red-shinku/honeyghost-builder:latest | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "builder: ghcr.io/red-shinku/honeyghost-builder@$digest"

      - name: 构建并推送 agent
        id: agent
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          BUILDER_DIGEST: ${{ steps.builder.outputs.digest }}
        run: |
          docker buildx build \
            -f deploy/docker/agent.Dockerfile \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=debian:13-slim \
            --build-arg "BUILDER_IMAGE=ghcr.io/red-shinku/honeyghost-builder@$BUILDER_DIGEST" \
            --build-arg "BUILDER_DIGEST=$BUILDER_DIGEST" \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from type=gha,scope=agent \
            --cache-to type=gha,mode=max,scope=agent \
            --push \
            -t "fifseason/honeyghost-agent:$TAG" .
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' \
            "fifseason/honeyghost-agent:$TAG" | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: 构建并推送 containerd-bridge
        id: bridge
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx build \
            -f agent/role_discovery/containerd_bridge/Dockerfile \
            --platform linux/amd64 \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from type=gha,scope=bridge \
            --cache-to type=gha,mode=max,scope=bridge \
            --push \
            -t "fifseason/honeyghost-containerd-bridge:$TAG" \
            agent/role_discovery/containerd_bridge
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' \
            "fifseason/honeyghost-containerd-bridge:$TAG" | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
