# 各键均可省略，省略即取内建默认值；来源优先级：默认 < 本文件 < 环境变量。

[collector]
enabled = true

[role_discovery]
systemd = true
containerd = true
containerd_socket_path = /run/honeyghost/containerd-bridge.sock

[role_filter]
path = role_filter.conf

[cli]
# 未编入 CLI 服务端时须改为 false，否则启动报错。
enabled = true
# 留空表示不覆盖 CLI 配置文件里的 socket。
socket_path =
config = cli_server.conf
