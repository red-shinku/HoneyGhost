# 容器内路径；相对路径以本文件所在目录为基准
[collector]
enabled = true

[role_discovery]
systemd = true
# 节点上没有 containerd 时改为 false，并删掉 compose 里的桥接服务
containerd = true
containerd_socket_path = /run/honeyghost/containerd-bridge.sock

[role_filter]
path = role_filter.conf

[cli]
enabled = true
socket_path = /run/honeyghost/cli.sock
config = cli_server.conf
