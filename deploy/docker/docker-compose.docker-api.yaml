# ============================================================
# 可选覆盖：传统镜像存储（overlay2 graphdriver）的 Docker
#
# 这种 Docker 不把镜像引用写进 containerd，容器角色的标签会退化成容器 ID。
# 本文件给桥接进程挂上 Docker API 并开启回查：
#
#   docker compose -f deploy/docker/docker-compose.yaml \
#                  -f deploy/docker/docker-compose.docker-api.yaml up -d
#
# 使用 containerd 镜像存储的宿主（docker info 的 driver-type 为
# io.containerd.snapshotter.v1）不需要本文件。
# ============================================================
services:
  containerd-bridge:
    command:
      - -socket=/run/honeyghost/containerd-bridge.sock
      - -containerd=/run/containerd/containerd.sock
      - -docker-socket=/var/run/docker.sock
    volumes:
      # Docker API：回查容器创建时指定的镜像引用
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          # 缺 socket 时直接报错：短语法会静默建出目录
          create_host_path: false
